replicaCount: 2
image:
  repository: changeme
  tag: changeme
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
env:
  - name: MLFLOW_TRACKING_URI
    value: http://pirates-mlflow:5000
  - name: MODEL_NAME
    value: task-priority-classifier
  - name: MODEL_ALIAS
    value: production
  - name: POLL_SECONDS
    value: "60"
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
autoscaling:
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 70
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 768Mi
