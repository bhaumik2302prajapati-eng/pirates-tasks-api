apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pirates-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bhaumik2302prajapati-eng/pirates-tasks-api.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
